name: Deploy

on:
  push:
    branches: [ "current-master" ]

# Authenticate to the server via ssh
# and run our deployment script
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Deploy to server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          port: ${{ secrets.PORT }}
          key: ${{ secrets.KEY }}
          script: "cd /var/www/superset/ && cp ./scripts/deploy.sh ./scripts/run.sh && chmod +x ./scripts/run.sh && ./scripts/run.sh"
